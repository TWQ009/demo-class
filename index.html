<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎓 新生福利中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0e17;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        /* 正常页面卡片 */
        .card {
            background: #ffffff;
            max-width: 420px;
            width: 100%;
            padding: 30px 25px;
            border-radius: 32px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            text-align: center;
            position: relative;
            transition: all 0.3s ease;
        }
        .badge {
            background: #ff6b35;
            color: white;
            padding: 4px 16px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        h2 {
            color: #0a0e17;
            font-size: 22px;
            margin-bottom: 4px;
        }
        .sub {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 22px;
        }
        .section {
            background: #f8fafc;
            border-radius: 20px;
            padding: 18px 14px;
            margin-bottom: 18px;
            border: 1px solid #e9edf2;
        }
        .section-title {
            font-weight: 600;
            color: #1e293b;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .upload-btn {
            background: #0a0e17;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 60px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }
        .upload-btn:hover {
            background: #1e293b;
        }
        input[type="file"] {
            display: none;
        }
        .preview-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-top: 12px;
            min-height: 30px;
        }
        .preview-grid img {
            width: 55px;
            height: 55px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #d1d9e6;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 15px;
            margin-bottom: 10px;
            transition: 0.2s;
        }
        .form-group input:focus {
            border-color: #ff6b35;
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.15);
        }
        .submit-btn {
            background: #ff6b35;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 60px;
            font-weight: bold;
            width: 100%;
            font-size: 17px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 8px 24px rgba(255, 107, 53, 0.35);
        }
        .submit-btn:hover {
            background: #e55a2b;
            transform: translateY(-2px);
        }
        .footer-note {
            margin-top: 16px;
            font-size: 11px;
            color: #94a3b8;
        }
        .footer-note strong {
            color: #dc2626;
        }

        /* ===== 黑客攻击成功覆盖层 ===== */
        .hack-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeIn 0.5s ease;
        }
        .hack-overlay.show {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .hack-box {
            background: #0d1117;
            border: 2px solid #ff0033;
            border-radius: 40px;
            padding: 40px 35px;
            max-width: 440px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 80px rgba(255, 0, 51, 0.4);
            animation: shake 0.6s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-15px); }
            40% { transform: translateX(15px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }
        .hack-box .skull {
            font-size: 70px;
            display: block;
            margin-bottom: 10px;
            animation: glitch 1.5s infinite;
        }
        @keyframes glitch {
            0% { transform: skew(0deg); }
            25% { transform: skew(5deg); opacity: 0.8; }
            50% { transform: skew(-5deg); opacity: 1; }
            75% { transform: skew(3deg); opacity: 0.9; }
            100% { transform: skew(0deg); }
        }
        .hack-box h1 {
            color: #ff0033;
            font-size: 28px;
            letter-spacing: 3px;
            text-shadow: 0 0 20px #ff003388;
            margin-bottom: 12px;
        }
        .hack-box .leaked {
            color: #e6edf3;
            font-size: 18px;
            background: #161b22;
            padding: 18px;
            border-radius: 16px;
            margin: 18px 0;
            text-align: left;
            border-left: 5px solid #ff0033;
            font-family: 'Courier New', monospace;
        }
        .hack-box .leaked span {
            color: #ff6b35;
            word-break: break-all;
        }
        .hack-box .photo-count {
            color: #58a6ff;
            font-size: 15px;
            margin: 10px 0 18px 0;
        }
        .reset-btn {
            background: transparent;
            border: 2px solid #ff0033;
            color: #ff0033;
            padding: 14px 30px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .reset-btn:hover {
            background: #ff0033;
            color: white;
        }
        .hack-box .sub-warning {
            color: #8b949e;
            font-size: 12px;
            margin-top: 16px;
        }
    </style>
</head>
<body>

    <!-- ===== 正常页面 ===== -->
    <div class="card" id="mainCard">
        <div class="badge">🔥 限时福利</div>
        <h2>新生专属签到</h2>
        <p class="sub">完成验证即可领取校园流量包 🎁</p>

        <!-- 第一步：相册 -->
        <div class="section">
            <div class="section-title">📷 上传一张生活照（验证身份）</div>
            <button class="upload-btn" onclick="document.getElementById('fileInput').click();">
                🖼️ 点击选择照片
            </button>
            <input type="file" id="fileInput" multiple accept="image/*" onchange="handlePhotos(this.files)">
            <div class="preview-grid" id="previewGrid"></div>
            <div style="font-size:12px; color:#94a3b8; margin-top:6px;">
                💡 支持多选，点"全选"可一次性上传
            </div>
        </div>

        <!-- 第二步：密码 -->
        <div class="section" style="margin-bottom: 0;">
            <div class="section-title">🔐 输入学号验证身份</div>
            <div class="form-group">
                <input type="text" id="username" placeholder="请输入学号 (例如 20240101)" value="20240001">
                <input type="password" id="password" placeholder="请输入校园网密码" value="123456">
            </div>
            <button class="submit-btn" onclick="triggerHack()">🎁 立即领取福利</button>
        </div>

        <div class="footer-note">
            <strong>⚠️ 课堂演示专用</strong> · 请勿输入真实密码
        </div>
    </div>

    <!-- ===== 黑客攻击覆盖层 ===== -->
    <div class="hack-overlay" id="hackOverlay">
        <div class="hack-box">
            <span class="skull">💀</span>
            <h1>⚠️ 已被入侵</h1>
            <div class="leaked">
                👤 学号：<span id="displayUser">---</span><br>
                🔑 密码：<span id="displayPass">---</span>
            </div>
            <div class="photo-count" id="displayPhotoCount">📸 已窃取 0 张照片</div>
            <button class="reset-btn" onclick="resetDemo()">🔒 我明白了，重置演示</button>
            <div class="sub-warning">
                这就是 <strong>网络钓鱼攻击</strong> 的模拟演示<br>
                你刚刚主动把信息交给了我
            </div>
        </div>
    </div>

    <script>
        let photoCount = 0;

        // ===== 相册处理 =====
        function handlePhotos(files) {
            const grid = document.getElementById('previewGrid');
            grid.innerHTML = '';
            if (files.length === 0) return;

            photoCount = files.length;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    grid.appendChild(img);
                };
                reader.readAsDataURL(file);
            }

            // 小小的视觉反馈
            const btn = document.querySelector('.upload-btn');
            btn.textContent = `✅ 已选 ${files.length} 张照片`;
            btn.style.background = '#22c55e';
            setTimeout(() => {
                btn.textContent = '🖼️ 点击重新选择';
                btn.style.background = '#0a0e17';
            }, 2000);
        }

        // ===== 触发"黑客攻击"效果 =====
        function triggerHack() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                alert('⚠️ 请先输入学号和密码（演示可随便填）');
                return;
            }

            // 填充劫持数据
            document.getElementById('displayUser').textContent = username;
            document.getElementById('displayPass').textContent = password;
            document.getElementById('displayPhotoCount').textContent = `📸 已窃取 ${photoCount || 0} 张照片`;

            // 显示黑客覆盖层
            document.getElementById('hackOverlay').classList.add('show');

            // 让背景卡片变灰（视觉辅助）
            document.getElementById('mainCard').style.opacity = '0.3';
            document.getElementById('mainCard').style.transform = 'scale(0.95)';
        }

        // ===== 重置演示 =====
        function resetDemo() {
            document.getElementById('hackOverlay').classList.remove('show');
            document.getElementById('mainCard').style.opacity = '1';
            document.getElementById('mainCard').style.transform = 'scale(1)';

            // 清空预览
            document.getElementById('previewGrid').innerHTML = '';
            photoCount = 0;
            document.querySelector('.upload-btn').textContent = '🖼️ 点击选择照片';
            document.querySelector('.upload-btn').style.background = '#0a0e17';

            // 重置输入框（保留测试值方便快速重演）
            document.getElementById('username').value = '20240001';
            document.getElementById('password').value = '123456';
        }

        // 键盘回车触发
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const overlay = document.getElementById('hackOverlay');
                if (overlay.classList.contains('show')) {
                    resetDemo();
                } else {
                    triggerHack();
                }
            }
        });
    </script>
</body>
</html>
